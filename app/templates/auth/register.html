{% extends "layouts/auth_layout.html" %}

{% block auth_content %}

<h1 class="auth-title">
    Đăng ký tài khoản
</h1>

<p style="text-align:center;margin-bottom:25px;">
    Tạo tài khoản sử dụng hệ thống AI DMS
</p>

{% if error %}

<div class="auth-error">
    {{ error }}
</div>

<br>

{% endif %}

<form
    method="POST"
    class="auth-form"
>

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <select name="role">

        <option value="employee">
            Employee
        </option>

        <option value="staff">
            Staff
        </option>

        <option value="admin">
            Admin
        </option>

    </select>

    <button class="btn">
        🚀 Đăng ký
    </button>

</form>

<div class="auth-footer">

    <a href="/">
        ← Quay lại đăng nhập
    </a>

</div>

{% endblock %}
