<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app">

    <div class="sidebar">
        <h2 class="logo">📂 DocSys</h2>

        <ul class="menu">
            {% block menu %}{% endblock %}
        </ul>

        <a href="/logout" class="logout">🚪 Đăng xuất</a>
    </div>

    <div class="main">

        <div class="navbar">
            <h3>Dashboard</h3>
            <span class="user">👤 {{ session['user'] }}</span>
        </div>

        <div class="content">
            {% block content %}{% endblock %}
        </div>

    </div>

</div>

</body>
</html>
